name: typescript-agent-evidence

on:
  push:
    paths:
      - "packages/agent-evidence/**"
      - "spec/agent-evidence/v0/**"
      - "conformance/rfc8785-vectors.json"
      - "python/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-agent-evidence.yml"
  pull_request:
    paths:
      - "packages/agent-evidence/**"
      - "spec/agent-evidence/v0/**"
      - "conformance/rfc8785-vectors.json"
      - "python/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/typescript-agent-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20.19", "22", "24"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run p1.9:test
      - run: npm run p1.9:external
      - run: npm audit --workspace @onchaindiligence/agent-evidence --omit=dev --audit-level=high
      - run: git diff --check

  cross-language:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/pyproject.toml
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e "./python[dev]"
      - run: npm run p1.9:cross-language
        env:
          P1_9_PYTHON: python
      - run: python -m pytest python/tests
      - run: python -m ruff check python
      - run: python -m ruff format --check python
      - run: python -m mypy --config-file python/pyproject.toml
      - run: python -m pip_audit
      - run: git diff --check
